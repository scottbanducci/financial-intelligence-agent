name: Offline analytical checks
on:
  push:
    branches: [experiment/market-liquidity-launch]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_intelligence_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile application
        run: python -m compileall -q src/financial_intelligence_agent app.py
      - name: Run all credential-free regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
