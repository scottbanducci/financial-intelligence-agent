# This is a Databricks asset bundle definition for financial_intelligence_agent.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: financial_intelligence_agent
  uuid: 1af8d0e5-316a-4f26-8eb7-4e8c4b2fc6da

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-cc985d61-8194.cloud.databricks.com
    variables:
      catalog: fed_monitor
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-cc985d61-8194.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/scott.banducci@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/scott.banducci@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fed_monitor
      schema: prod
    permissions:
      - user_name: scott.banducci@gmail.com
        level: CAN_MANAGE
