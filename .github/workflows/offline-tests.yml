name: Offline analytical and app checks
on:
  push:
    branches: [experiment/market-liquidity-launch]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_intelligence_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and ML dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q src/financial_intelligence_agent app.py
      - name: Run complete offline test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Seven-page UI and chart-render integration checks
        env:
          ANALYST_DISABLE_CATALOG_WARM: "1"
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file("app.py",default_timeout=30).run()
          if app.exception: raise AssertionError(str(app.exception))
          for target in ("Live Data Studio","Command center","Funding desk","Operator lab","Model lab","Analyst agent","Data catalog"):
              app.sidebar.radio[0].set_value(target).run()
              if app.exception: raise AssertionError(target+": "+str(app.exception))
              print("Render succeeded:",target)
          # Exercise chart studio with actual typed synthetic series; this
          # does not issue any external provider queries or use a secret.
          from financial_intelligence_agent.engine.operators import Series,Point
          from financial_intelligence_agent.live.providers import Descriptor
          from datetime import date
          x=Series("test_sofr","FRED","percent","daily",
                   tuple(Point(date(2026,10,i+1),3.80+i/100) for i in range(8)))
          y=Series("test_effr","NYFED","percent","daily",
                   tuple(Point(date(2026,10,i+1),3.90+i/100) for i in range(8)))
          dx=Descriptor("FRED:SOFR","SOFR","FRED","percent","daily","rates","https://fred.stlouisfed.org/series/SOFR")
          dy=Descriptor("NYFED:EFFR","EFFR","NYFED","percent","daily","rates","https://markets.newyorkfed.org/api/rates")
          app.session_state["analyst_workspace"]={
              "test_sofr":{"series":x,"descriptor":dx,"retrieved":"fixture-test","warning":""},
              "test_effr":{"series":y,"descriptor":dy,"retrieved":"fixture-test","warning":""},
          }
          app.sidebar.radio[0].set_value("Live Data Studio").run()
          if app.exception: raise AssertionError("Chart Studio loaded data: "+str(app.exception))
          print("Interactive Chart Studio renders with two typed time series")
          PY
      - name: Build deployable OCI container
        run: docker build --progress=plain -t liquidity-workbench:test -f Dockerfile .
      - name: Advisory live publisher contract probe
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/probe_public_apis.py
